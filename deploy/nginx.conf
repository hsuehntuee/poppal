# 和 scripts/serve-local.mjs 做一樣的事：
#   /            服務頁（SPA），並在 </head> 前注入 guide-overlay.js（服務程式碼零改動）
#   /assistant/  小幫手（SPA）
#   /llm/        轉發到 llama-server 容器
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/wasm;
    gzip_min_length 1024;

    location /llm/ {
        proxy_pass http://llm:8080/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin * always;
    }

    location /assistant/ {
        alias /usr/share/nginx/html/assistant/;
        try_files $uri $uri/ /assistant/index.html;
        location ~* /assistant/(assets|models)/ {
            alias /usr/share/nginx/html/assistant/;
            rewrite ^/assistant/(.*)$ /$1 break;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
        sub_filter '</head>' '<script src="/assistant/guide-overlay.js" defer></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
