# CPU server 部署（選配；Demo 主線是筆電 + 手機同內網）。
#   docker compose -f deploy/docker-compose.yml up -d --build
# 對外：http://<server>:18080/assistant/
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "18080:80"
    depends_on:
      - llm
    restart: unless-stopped

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    # Gemma 3 270M（Google）Q8_0：第一次啟動會從 Hugging Face 下載（約 300MB）到 volume
    command: >
      -hf unsloth/gemma-3-270m-it-GGUF:Q8_0
      --host 0.0.0.0 --port 8080
      -c 4096 -np 2 --threads 6
      --cache-reuse 256
    environment:
      - LLAMA_ARG_N_PARALLEL=2
    volumes:
      - llm-cache:/root/.cache/llama.cpp
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  llm-cache:
